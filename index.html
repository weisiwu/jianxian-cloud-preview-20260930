<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self'; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>剑仙破幽录</title>
<style>
:root{--ui-paper:#fff8e7;--ui-jade:#24624d;--ui-edge:#9eaf8d;--ui-surround:#dce5cb}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ui-surround)}
body{display:flex;justify-content:center;background:radial-gradient(ellipse at 50% 20%,var(--ui-paper),var(--ui-surround) 65%)}
canvas{display:block;width:min(100vw,56.25vh);height:100vh;touch-action:none;user-select:none;background:var(--ui-paper);box-shadow:0 0 0 1px var(--ui-edge),0 0 70px #24624d20}
@supports(height:100dvh){canvas{width:min(100vw,56.25dvh);height:100dvh}}
</style>
</head>
<body>
<canvas id="gameCanvas" aria-label="剑仙破幽录游戏画面"></canvas>
<script src="preview-privacy.js"></script>
<script src="game.js"></script>
</body>
</html>
